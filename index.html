<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placecard</title>
<meta name="description" content="A seating planner where every guest is a face, so each table reads at a glance.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#127869;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Placecard</h1>
      <input class="couple" id="couple" aria-label="Whose wedding" spellcheck="false">
    </div>

    <div class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6"></circle><path d="M10.4 10.4 14 14"></path>
      </svg>
      <input id="q" type="search" placeholder="Find a guest" aria-label="Find a guest">
    </div>

    <div class="bar-spacer"></div>

    <div class="tally">
      <div class="nums" id="tally"></div>
      <div class="meter"><i id="meter" style="width:0%"></i></div>
    </div>

    <div class="seg" role="group" aria-label="View">
      <button id="v-plan" aria-pressed="true">Plan</button>
      <button id="v-compact" aria-pressed="false">Compact</button>
    </div>

    <button class="btn btn-primary" id="add-guests">Add guests</button>

    <details class="menu">
      <summary aria-label="More actions">&#8943;</summary>
      <div class="sheet">
        <button id="m-table">Add a table</button>
        <button id="m-groups">Edit groups&hellip;</button>
        <hr>
        <button id="m-photos">Import a folder of photos&hellip;</button>
        <button id="m-print">Print the table plan</button>
        <hr>
        <button id="m-connect">Shared plan&hellip;</button>
        <hr>
        <button id="m-export">Download backup (.json)</button>
        <button id="m-csv">Download list (.csv)</button>
        <button id="m-import">Restore from backup&hellip;</button>
        <hr>
        <button id="m-reset" class="btn-danger">Start over&hellip;</button>
      </div>
    </details>

    <div class="status" id="status" data-s="idle">Local</div>
  </header>

  <div class="main">
    <aside class="rail">
      <div class="rail-head">
        <div class="rail-title">
          <h2>Not seated</h2>
          <span class="count" id="pool-count">0</span>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="pool" id="pool"></div>
      <div class="insp empty" id="insp"></div>
    </aside>

    <main class="plan" id="plan">
      <div class="tables" id="tables"></div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog id="dlg-guests">
  <div class="dlg-head">
    <h3>Add guests</h3>
    <p>One name per line. Paste straight from a spreadsheet or your notes &mdash; names already on the list are skipped.</p>
  </div>
  <div class="dlg-body">
    <textarea id="guest-names" spellcheck="false" placeholder="Ana Popescu&#10;Mihai Popescu&#10;Elena Ionescu"></textarea>
    <div style="margin-top:10px;display:flex;align-items:center;gap:8px">
      <label for="guest-group" style="color:var(--muted);font-size:12.5px">Put them all in</label>
      <select id="guest-group"></select>
    </div>
  </div>
  <div class="dlg-foot">
    <span class="note" id="guest-note"></span>
    <button class="btn" data-close>Cancel</button>
    <button class="btn btn-primary" id="guest-save">Add them</button>
  </div>
</dialog>

<dialog id="dlg-groups">
  <div class="dlg-head">
    <h3>Groups</h3>
    <p>A colour band under each face, so you can see at a glance how a table is mixed.</p>
  </div>
  <div class="dlg-body" id="groups-body"></div>
  <div class="dlg-foot">
    <button class="btn" id="group-add">Add a group</button>
    <button class="btn btn-primary" data-close>Done</button>
  </div>
</dialog>

<dialog id="dlg-connect">
  <div class="dlg-head">
    <h3>Shared plan</h3>
    <p id="connect-msg"></p>
  </div>
  <div class="dlg-body">
    <input type="password" id="connect-key" autocomplete="current-password"
           placeholder="Passphrase" aria-label="Passphrase">
  </div>
  <div class="dlg-foot">
    <button class="btn btn-danger" id="connect-off">Disconnect</button>
    <button class="btn" data-close>Cancel</button>
    <button class="btn btn-primary" id="connect-go">Connect</button>
  </div>
</dialog>

<input type="file" id="file-photo" accept="image/*" hidden>
<input type="file" id="file-photos" accept="image/*" multiple hidden>
<input type="file" id="file-json" accept="application/json,.json" hidden>


<script src="app.js"></script>
</body>
</html>
